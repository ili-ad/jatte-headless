components:
  schemas:
    Message:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        text:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        sent_by:
          type: string
          nullable: true
        parent_id:
          oneOf:
            - type: integer
            - type: string
          nullable: true
        show_in_channel:
          type: boolean
        custom_data:
          type: object
          additionalProperties: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/MessageAttachment'
        preview:
          allOf:
            - $ref: '#/components/schemas/MessagePreview'
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        hidden:
          type: boolean
        hidden_at:
          type: string
          format: date-time
          nullable: true
    SearchMessage:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        text:
          type: string
        user_id:
          oneOf:
            - type: integer
            - type: string
        created_at:
          type: string
          format: date-time
        cid:
          type: string
      required: [id, text, user_id, created_at, cid]
    MessageAttachment:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        content_type:
          type: string
    AdminQueueRoom:
      type: object
      properties:
        cid:
          type: string
        name:
          type: string
          nullable: true
        last_message_at:
          type: string
          format: date-time
          nullable: true
        last_text:
          type: string
          nullable: true
        owner_id:
          type: string
          nullable: true
        unread_count:
          type: integer
      required: [cid, unread_count]
    ClaimRoomResponse:
      type: object
      properties:
        cid:
          type: string
        owner_id:
          type: string
        claimed_at:
          type: string
          format: date-time
      required: [cid, owner_id, claimed_at]
    GatingRules:
      type: object
      properties:
        languages:
          type: array
          items:
            type: string
        min_length:
          type: integer
        max_length:
          type: integer
        min_interval_seconds:
          type: integer
        blocklist:
          type: array
          items:
            type: string
      required: [languages, min_length, max_length, min_interval_seconds, blocklist]
    IntakeItem:
      type: object
      properties:
        message_id:
          type: string
        cid:
          type: string
        user_id:
          type: string
        text:
          type: string
        created_at:
          type: string
          format: date-time
        status:
          type: string
        reason:
          type: string
          nullable: true
      required: [message_id, cid, user_id, text, created_at, status]
    IntakeListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/IntakeItem'
        next:
          type: string
          nullable: true
      required: [results]
    IntakeActionResponse:
      type: object
      properties:
        message_id:
          type: string
        status:
          type: string
        muted:
          type: boolean
      required: [message_id, status, muted]
    RejectIntakeRequest:
      type: object
      properties:
        reason:
          type: string
        mute:
          type: boolean
      additionalProperties: false
    IntakeSummary:
      type: object
      properties:
        intake:
          type: object
          properties:
            pending:
              type: integer
            rejected:
              type: integer
          required: [pending, rejected]
      required: [intake]
    OnCallConfig:
      type: object
      properties:
        phone_e164:
          type: string
          nullable: true
          example: '+15551234567'
        email:
          type: string
          format: email
          nullable: true
          example: ops@example.com
      required: [phone_e164, email]
    OnCallConfigUpdate:
      type: object
      properties:
        phone_e164:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
          format: email
      additionalProperties: false
    EscalationRequest:
      type: object
      properties:
        cid:
          type: string
        reason:
          type: string
      required: [cid, reason]
    EscalationResponse:
      type: object
      properties:
        cid:
          type: string
        notified:
          type: boolean
        via:
          type: string
          enum: [sms, email, none]
      required: [cid, notified, via]
    AgentToggleResponse:
      type: object
      properties:
        cid:
          type: string
        agent_enabled:
          type: boolean
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: [cid, agent_enabled]
    AgentInvokeRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
        meta:
          type: object
          additionalProperties: true
    AgentInvokeResponse:
      type: object
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [queued]
      required: [run_id, status]
        size:
          type: integer
        sha256:
          type: string
      required:
      - id
      - name
      - url
    MessagePreview:
      type: object
      properties:
        url:
          type: string
          format: uri
        title:
          type: string
      required:
      - url
      - title
    Reminder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        remind_at:
          type: string
          format: date-time
      required:
      - id
      - text
      - remind_at
    ReminderCreate:
      type: object
      properties:
        text:
          type: string
        remind_at:
          type: string
          format: date-time
      required:
      - text
      - remind_at
        deleted_at:
          type: string
          format: date-time
          nullable: true
      required: [id]
    ThreadPreview:
      type: object
      properties:
        thread_id:
          type: string
        cid:
          type: string
        root_message:
          $ref: '#/components/schemas/Message'
        reply_count:
          type: integer
        last_reply_at:
          type: string
          format: date-time
          nullable: true
        last_reply_preview:
          $ref: '#/components/schemas/Message'
          nullable: true
      required: [thread_id, cid, root_message, reply_count]
    MuteStatus:
      type: object
      properties:
        muted:
          type: boolean
        muted_until:
          type: string
          format: date-time
          nullable: true
      required: [muted]
    MuteCreate:
      type: object
      properties:
        user_id:
          type: integer
        muted_until:
          type: string
          format: date-time
      required: [user_id]
    Mute:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
        muted_until:
          type: string
          format: date-time
          nullable: true
        muted_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    UserAgentInfo:
      type: object
      properties:
        user_agent:
          type: string
      required: [user_agent]
    WebPushKeys:
      type: object
      properties:
        p256dh:
          type: string
        auth:
          type: string
      required: [p256dh, auth]
    WebPushSubscription:
      type: object
      properties:
        endpoint:
          type: string
        expirationTime:
          type: number
          nullable: true
        keys:
          $ref: '#/components/schemas/WebPushKeys'
      required: [endpoint, keys]
    RegisterSubscriptionsRequest:
      type: object
      properties:
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/WebPushSubscription'
        client_id:
          type: string
        platform:
          type: string
          enum: [web, ios, android]
      required: [subscriptions]
    RegisterSubscriptionsResponse:
      type: object
      properties:
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/WebPushSubscription'
        client_id:
          type: string
          nullable: true
        platform:
          type: string
          nullable: true
    ReminderCreate:
      type: object
      properties:
        remind_at:
          type: string
          format: date-time
        message_id:
          type: integer
        note:
          type: string
      required: [remind_at]
    Reminder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        remind_at:
          type: string
          format: date-time
        message_id:
          type: integer
          nullable: true
        note:
          type: string
          nullable: true
        created_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    PollOption:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
    Poll:
      type: object
      properties:
        poll_id:
          type: string
        cid:
          type: string
        question:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/PollOption'
        created_at:
          type: string
          format: date-time
          nullable: true
    PollVote:
      type: object
      properties:
        user_id:
          type: string
        ts:
          type: string
          format: date-time
    PollAnswer:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    PollVoteEvent:
      type: object
      properties:
        status:
          type: string
        poll_id:
          type: string
        option_id:
          type: string
          nullable: true
        user_id:
          type: string
        poll_vote:
          type: object
          additionalProperties: true
          nullable: true
        from_option_id:
          type: string
          nullable: true
        to_option_id:
          type: string
          nullable: true
