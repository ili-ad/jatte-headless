openapi: 3.1.0
info:
  title: Frontend Derived API
  version: "1.0.0"
paths:
  /sync-user/:
    post:
      operationId: syncUser
      tags: [accounts]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
  /session/:
    delete:
      operationId: endSession
      tags: [accounts]
      responses:
        '204':
          description: No Content
  /client-id/:
    get:
      operationId: getClientId
      tags: [identity]
      responses:
        '200':
          description: client id
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id:
                    type: string
  /connection-id/:
    get:
      operationId: getConnectionId
      tags: [identity]
      responses:
        '200':
          description: connection id
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection_id:
                    type: string
  /search/messages/:
    get:
      operationId: searchMessages
      tags: [messages]
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
        - in: query
          name: cid
          required: false
          schema:
            type: string
        - in: query
          name: before
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchMessage'
                  next:
                    type: string
                    nullable: true
                required: [results]
        '422':
          description: Invalid search parameters
        '504':
          description: Search timed out
  /rooms/:
    get:
      operationId: listRooms
      tags: [rooms]
      responses:
        '200':
          description: list of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    uuid:
                      type: string
                    name:
                      type: string
                    data:
                      type: object
                      additionalProperties: true
  /rooms/active/:
    get:
      operationId: listActiveRooms
      tags: [rooms]
      responses:
        '200':
          description: active rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/paths/~1rooms~1/get/responses/200/content/application~1json/schema/items'
  /api/rooms/{cid}/messages/{message_id}/:
    get:
      description: Retrieve a single message by id within a room.
      operationId: getMessage
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
        - in: path
          name: message_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Not Found
      tags: [api]
  /api/rooms/{cid}/mute/:
    get:
      description: Return whether the current user has muted this room.
      operationId: muteStatus
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MuteStatus'
      tags: [api]
    delete:
      description: Delete a message in a room.
      operationId: deleteMessage
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
        - in: path
          name: message_id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: ''
      tags: [api]
  /api/rooms/{cid}/reminders/:
    post:
      description: Create a reminder in a room.
      operationId: createReminder
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
      tags: [api]
  /messages/{messageId}/:
    parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getMessage
      tags: [messages]
      responses:
        '200':
          description: message
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  text:
                    type: string
                  user_id:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
    put:
      operationId: updateMessage
      tags: [messages]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
    delete:
      operationId: deleteMessage
      tags: [messages]
      responses:
        '200':
          description: deleted
          content:
            application/json:
              schema:
                type: object
  /messages/{messageId}/replies/:
    parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listReplies
      tags: [messages]
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
        - in: query
          name: before
          required: false
          schema:
            type: string
      responses:
        '200':
          description: replies for a message
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  next:
                    type: string
                    nullable: true
        '400':
          description: invalid query parameters
        '403':
          description: forbidden
        '404':
          description: parent message not found
  /messages/{messageId}/hide/:
    parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: hideMessage
      tags: [moderation]
      responses:
        '200':
          description: message hidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [hidden]
                  message:
                    $ref: '#/components/schemas/Message'
        '403':
          description: forbidden
        '404':
          description: message not found
    delete:
      operationId: unhideMessage
      tags: [moderation]
      responses:
        '200':
          description: message visible
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [visible]
                  message:
                    $ref: '#/components/schemas/Message'
        '403':
          description: forbidden
        '404':
          description: message not found
  /messages/{messageId}/restore/:
    post:
      operationId: restoreMessage
      tags: [messages]
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: restored
          content:
            application/json:
              schema:
                type: object
  /chat/admin/queue/:
    get:
      operationId: listAdminQueue
      tags: [chat-admin]
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [new, mine]
          description: Filter by unclaimed or rooms owned by the caller.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            description: Keyset cursor returned from a previous call.
      responses:
        '200':
          description: queue rows for the requested status
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminQueueRoom'
                  next:
                    type: string
                    nullable: true
                required: [results]
        '401':
          description: unauthenticated
        '403':
          description: forbidden
  /chat/admin/rooms/{cid}/claim/:
    parameters:
      - name: cid
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: claimRoom
      tags: [chat-admin]
      responses:
        '200':
          description: room claimed by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimRoomResponse'
        '403':
          description: room already owned by a different operator
        '404':
          description: room not found
  /chat/admin/gating-rules/:
    get:
      operationId: getGatingRules
      tags: [chat-admin]
      responses:
        '200':
          description: current gating configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatingRules'
        '401':
          description: unauthenticated
        '403':
          description: forbidden
    put:
      operationId: updateGatingRules
      tags: [chat-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatingRules'
      responses:
        '200':
          description: updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatingRules'
        '400':
          description: validation error
        '401':
          description: unauthenticated
        '403':
          description: forbidden
  /chat/admin/intake/:
    get:
      operationId: listIntake
      tags: [chat-admin]
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, rejected, all]
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            description: Encoded cursor from a previous response.
      responses:
        '200':
          description: intake entries for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeListResponse'
        '401':
          description: unauthenticated
        '403':
          description: forbidden
  /chat/admin/intake/{messageId}/approve/:
    parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: approveIntake
      tags: [chat-admin]
      responses:
        '200':
          description: message approved and revealed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeActionResponse'
        '401':
          description: unauthenticated
        '403':
          description: forbidden
        '404':
          description: intake not found
  /chat/admin/intake/{messageId}/reject/:
    parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: rejectIntake
      tags: [chat-admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectIntakeRequest'
      responses:
        '200':
          description: message rejected and remains hidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeActionResponse'
        '401':
          description: unauthenticated
        '403':
          description: forbidden
        '404':
          description: intake not found
  /chat/integrations/sms/webhook/:
    post:
      operationId: smsInboundWebhook
      tags: [chat-integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, text, external_id, event]
              properties:
                from:
                  type: string
                  description: Sender phone number in E.164 format.
                to:
                  type: string
                  description: Business phone number receiving the SMS.
                text:
                  type: string
                external_id:
                  type: string
                  description: Provider message identifier.
                event:
                  type: string
                  enum: [message]
      responses:
        '200':
          description: webhook processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '403':
          description: invalid signature
  /chat/integrations/sms/send/:
    post:
      operationId: smsSend
      tags: [chat-integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cid, to, text]
              properties:
                cid:
                  type: string
                  description: Room channel identifier (e.g. messaging:<uuid>).
                to:
                  type: string
                  description: Destination phone number in E.164 format.
                text:
                  type: string
      responses:
        '202':
          description: SMS accepted for delivery
          content:
            application/json:
              schema:
                type: object
                required: [run_id, status]
                properties:
                  run_id:
                    type: string
                  status:
                    type: string
        '401':
          description: unauthenticated
        '403':
          description: forbidden
        '502':
          description: provider error
  /chat/integrations/sms/receipt/:
    post:
      operationId: smsDeliveryReceipt
      tags: [chat-integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_id, status]
              properties:
                external_id:
                  type: string
                status:
                  type: string
                  enum: [delivered, failed]
                error_code:
                  type: string
                  nullable: true
      responses:
        '200':
          description: receipt applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '404':
          description: relay not found
  /chat/agent/{cid}/:
    parameters:
      - name: cid
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAgentStatus
      tags: [chat-agent]
      responses:
        '200':
          description: agent toggle state for the requested room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentToggleResponse'
        '401':
          description: unauthenticated
        '403':
          description: forbidden
  /chat/agent/{cid}/enable/:
    parameters:
      - name: cid
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: enableAgent
      tags: [chat-agent]
      responses:
        '200':
          description: agent enabled for the room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentToggleResponse'
        '401':
          description: unauthenticated
        '403':
          description: forbidden
  /chat/agent/{cid}/disable/:
    parameters:
      - name: cid
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: disableAgent
      tags: [chat-agent]
      responses:
        '200':
          description: agent disabled for the room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentToggleResponse'
        '401':
          description: unauthenticated
        '403':
          description: forbidden
  /chat/agent/{cid}/invoke/:
    parameters:
      - name: cid
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: invokeAgent
      tags: [chat-agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentInvokeRequest'
      responses:
        '202':
          description: invocation accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInvokeResponse'
        '400':
          description: invalid prompt
        '401':
          description: unauthenticated
        '403':
          description: forbidden
  /chat/notifications/oncall/:
    get:
      operationId: getOnCall
      tags: [chat-notifications]
      responses:
        '200':
          description: on-call contact information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnCallConfig'
        '401':
          description: unauthenticated
        '403':
          description: forbidden
    put:
      operationId: setOnCall
      tags: [chat-notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnCallConfigUpdate'
      responses:
        '200':
          description: updated on-call contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnCallConfig'
        '401':
          description: unauthenticated
        '403':
          description: forbidden
  /chat/notifications/presence/:
    post:
      operationId: adminHeartbeat
      tags: [chat-notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '204':
          description: heartbeat stored
        '401':
          description: unauthenticated
        '403':
          description: forbidden
  /chat/notifications/escalate/:
    post:
      operationId: escalateRoom
      tags: [chat-notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationRequest'
      responses:
        '200':
          description: escalation outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationResponse'
        '401':
          description: unauthenticated
        '403':
          description: forbidden
  /chat/notifications/intake/:
    get:
      operationId: getIntakeSummary
      tags: [chat-notifications]
      responses:
        '200':
          description: aggregate intake counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeSummary'
        '401':
          description: unauthenticated
        '403':
          description: forbidden
  /app-settings/:
    get:
      operationId: getAppSettings
      tags: [settings]
      responses:
        '200':
          description: settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_uploads:
                    type: boolean
  /users/:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        '200':
          description: users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    username:
                      type: string
  /user/:
    get:
      operationId: currentUser
      tags: [users]
      responses:
        '200':
          description: current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
  /user-agent/:
    get:
      operationId: listUserAgents
      tags: [users]
      responses:
        '200':
          description: user agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAgentInfo'
    post:
      operationId: setUserAgent
      description: Set or report the client User-Agent for the current user/session.
      tags: [users]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAgentInfo'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAgentInfo'
  /notifications/:
    get:
      operationId: listNotifications
      tags: [notifications]
      responses:
        '200':
          description: notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /polls/:
    get:
      operationId: listPolls
      tags: [polls]
      parameters:
        - in: query
          name: cid
          required: true
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        '200':
          description: polls
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Poll'
                  next:
                    type: string
                    nullable: true
    post:
      operationId: createPoll
      tags: [polls]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cid, question, options]
              properties:
                cid:
                  type: string
                question:
                  type: string
                options:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  poll:
                    $ref: '#/components/schemas/Poll'
  /polls/{pollId}/options/:
    post:
      operationId: createPollOption
      tags: [polls]
      parameters:
        - in: path
          name: pollId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        '200':
          description: created poll option
          content:
            application/json:
              schema:
                type: object
                properties:
                  option:
                    $ref: '#/components/schemas/PollOption'
  /polls/{pollId}/options/{optionId}/votes/:
    get:
      operationId: queryOptionVotes
      tags: [polls]
      parameters:
        - in: path
          name: pollId
          required: true
          schema:
            type: string
        - in: path
          name: optionId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        '200':
          description: vote page
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PollVote'
                  count:
                    type: integer
                  next:
                    type: string
                    nullable: true
    post:
      operationId: castVote
      tags: [polls]
      parameters:
        - in: path
          name: pollId
          required: true
          schema:
            type: string
        - in: path
          name: optionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: vote recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollVoteEvent'
    delete:
      operationId: removeVote
      tags: [polls]
      parameters:
        - in: path
          name: pollId
          required: true
          schema:
            type: string
        - in: path
          name: optionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: vote removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollVoteEvent'
  /polls/{pollId}/answers/:
    post:
      operationId: addAnswer
      tags: [polls]
      parameters:
        - in: path
          name: pollId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        '200':
          description: answer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    $ref: '#/components/schemas/PollAnswer'
