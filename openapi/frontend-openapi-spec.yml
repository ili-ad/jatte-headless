openapi: 3.1.0
info:
  title: Frontend Derived API
  version: "1.0.0"
paths:
  /sync-user/:
    post:
      operationId: syncUser
      tags: [accounts]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
  /session/:
    delete:
      operationId: endSession
      tags: [accounts]
      responses:
        '204':
          description: No Content
  /client-id/:
    get:
      operationId: getClientId
      tags: [identity]
      responses:
        '200':
          description: client id
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id:
                    type: string
  /connection-id/:
    get:
      operationId: getConnectionId
      tags: [identity]
      responses:
        '200':
          description: connection id
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection_id:
                    type: string
  /rooms/:
    get:
      operationId: listRooms
      tags: [rooms]
      responses:
        '200':
          description: list of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    uuid:
                      type: string
                    name:
                      type: string
                    data:
                      type: object
                      additionalProperties: true
  /rooms/active/:
    get:
      operationId: listActiveRooms
      tags: [rooms]
      responses:
        '200':
          description: active rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/paths/~1rooms~1/get/responses/200/content/application~1json/schema/items'
  /api/rooms/{cid}/messages/{message_id}/:
    get:
      description: Retrieve a single message by id within a room.
      operationId: getMessage
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
        - in: path
          name: message_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Not Found
      tags: [api]
  /api/rooms/{cid}/mute/:
    get:
      description: Return whether the current user has muted this room.
      operationId: muteStatus
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MuteStatus'
      tags: [api]
    delete:
      description: Delete a message in a room.
      operationId: deleteMessage
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
        - in: path
          name: message_id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: ''
      tags: [api]
  /api/rooms/{cid}/reminders/:
    post:
      description: Create a reminder in a room.
      operationId: createReminder
      parameters:
        - in: path
          name: cid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
      tags: [api]
  /messages/{messageId}/:
    parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getMessage
      tags: [messages]
      responses:
        '200':
          description: message
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  text:
                    type: string
                  user_id:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
    put:
      operationId: updateMessage
      tags: [messages]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
    delete:
      operationId: deleteMessage
      tags: [messages]
      responses:
        '200':
          description: deleted
          content:
            application/json:
              schema:
                type: object
  /messages/{messageId}/replies/:
    parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listReplies
      tags: [messages]
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
        - in: query
          name: before
          required: false
          schema:
            type: string
      responses:
        '200':
          description: replies for a message
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  next:
                    type: string
                    nullable: true
        '400':
          description: invalid query parameters
        '403':
          description: forbidden
        '404':
          description: parent message not found
  /messages/{messageId}/restore/:
    post:
      operationId: restoreMessage
      tags: [messages]
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: restored
          content:
            application/json:
              schema:
                type: object
  /app-settings/:
    get:
      operationId: getAppSettings
      tags: [settings]
      responses:
        '200':
          description: settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_uploads:
                    type: boolean
  /users/:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        '200':
          description: users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    username:
                      type: string
  /user/:
    get:
      operationId: currentUser
      tags: [users]
      responses:
        '200':
          description: current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
  /user-agent/:
    get:
      operationId: listUserAgents
      tags: [users]
      responses:
        '200':
          description: user agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAgentInfo'
    post:
      operationId: setUserAgent
      description: Set or report the client User-Agent for the current user/session.
      tags: [users]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAgentInfo'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAgentInfo'
  /notifications/:
    get:
      operationId: listNotifications
      tags: [notifications]
      responses:
        '200':
          description: notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /polls/:
    get:
      operationId: listPolls
      tags: [polls]
      parameters:
        - in: query
          name: cid
          required: true
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        '200':
          description: polls
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Poll'
                  next:
                    type: string
                    nullable: true
    post:
      operationId: createPoll
      tags: [polls]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cid, question, options]
              properties:
                cid:
                  type: string
                question:
                  type: string
                options:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  poll:
                    $ref: '#/components/schemas/Poll'
  /polls/{pollId}/options/:
    post:
      operationId: createPollOption
      tags: [polls]
      parameters:
        - in: path
          name: pollId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        '200':
          description: created poll option
          content:
            application/json:
              schema:
                type: object
                properties:
                  option:
                    $ref: '#/components/schemas/PollOption'
  /polls/{pollId}/options/{optionId}/votes/:
    get:
      operationId: queryOptionVotes
      tags: [polls]
      parameters:
        - in: path
          name: pollId
          required: true
          schema:
            type: string
        - in: path
          name: optionId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        '200':
          description: vote page
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PollVote'
                  count:
                    type: integer
                  next:
                    type: string
                    nullable: true
    post:
      operationId: castVote
      tags: [polls]
      parameters:
        - in: path
          name: pollId
          required: true
          schema:
            type: string
        - in: path
          name: optionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: vote recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollVoteEvent'
    delete:
      operationId: removeVote
      tags: [polls]
      parameters:
        - in: path
          name: pollId
          required: true
          schema:
            type: string
        - in: path
          name: optionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: vote removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollVoteEvent'
  /polls/{pollId}/answers/:
    post:
      operationId: addAnswer
      tags: [polls]
      parameters:
        - in: path
          name: pollId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        '200':
          description: answer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    $ref: '#/components/schemas/PollAnswer'
  /reminders/:
    get:
      operationId: listReminders
      tags: [reminders]
      responses:
        '200':
          description: reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      operationId: createReminder
      tags: [reminders]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                remind_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminder:
                    type: object
  /threads/:
    get:
      operationId: listThreads
      tags: [threads]
      parameters:
        - in: query
          name: cid
          required: true
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        '200':
          description: thread previews
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ThreadPreview'
                  next:
                    type: string
                    nullable: true
        '400':
          description: missing or invalid cid
        '403':
          description: forbidden
  /link-preview/:
    post:
      operationId: createLinkPreview
      tags: [link]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
      responses:
        '200':
          description: preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  title:
                    type: string
  /mute-status/{username}/:
    parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: muteStatus
      tags: [mutes]
      responses:
        '200':
          description: mute status
          content:
            application/json:
              schema:
                type: object
                properties:
                  muted:
                    type: boolean
  /muted-users/:
    get:
      operationId: listMutedUsers
      tags: [mutes]
      responses:
        '200':
          description: muted users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /muted-channels/:
    get:
      operationId: listMutedChannels
      tags: [mutes]
      responses:
        '200':
          description: muted channels
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /rooms/{cid}/mutes/:
    parameters:
      - name: cid
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: muteUser
      description: Mute a member in a room (moderation).
      tags: [api]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MuteCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mute'
  /user-mutes/unmute/:
    post:
      description: Unmute a previously muted user (global).
      operationId: unmuteUser
      tags: [api]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_user_id
              properties:
                target_user_id:
                  type: integer
      responses:
        '200':
          description: Unmuted
          content:
            application/json:
              schema:
                type: object
                properties:
                  target_user_id:
                    type: integer
                  muted:
                    type: boolean
                    enum:
                      - false
  /recover-state/:
    get:
      operationId: recoverState
      tags: [state]
      responses:
        '200':
          description: recovery state
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      type: object
                  notifications:
                    type: array
                    items:
                      type: object
  /refresh-token/:
    get:
      operationId: refreshToken
      tags: [auth]
      responses:
        '200':
          description: new token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /subarray/:
    post:
      operationId: subarray
      tags: [utils]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                array:
                  type: array
                  items: {}
                start:
                  type: integer
                end:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: sliced
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items: {}
  /editing-audit-state/:
    post:
      operationId: editingAuditState
      tags: [state]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                draft_update:
                  type: integer
                state_update:
                  type: integer
      responses:
        '200':
          description: echo
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft_update:
                    type: integer
                  state_update:
                    type: integer
  /ws-auth/:
    get:
      operationId: wsAuth
      tags: [auth]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /attachments/:
    post:
      operationId: uploadAttachment
      tags: [attachments]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment:
                    type: object
  /disconnected/:
    get:
      operationId: isDisconnected
      tags: [state]
      responses:
        '200':
          description: flag
          content:
            application/json:
              schema:
                type: object
                properties:
                  disconnected:
                    type: boolean
  /initialized/:
    get:
      operationId: isInitialized
      tags: [state]
      responses:
        '200':
          description: flag
          content:
            application/json:
              schema:
                type: object
                properties:
                  initialized:
                    type: boolean
  /listeners/:
    get:
      operationId: getListeners
      tags: [events]
      responses:
        '200':
          description: listeners
          content:
            application/json:
              schema:
                type: object
                properties:
                  listeners:
                    type: array
                    items:
                      type: string
  /dispatch-event/:
    post:
      operationId: dispatchEvent
      tags: [events]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: echo
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    type: object
  /register-subscriptions/:
    post:
      operationId: registerSubscriptions
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterSubscriptionsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSubscriptionsResponse'
  /quoted-message/:
    get:
      operationId: getQuotedMessage
      tags: [messages]
      responses:
        '200':
          description: stored message
          content:
            application/json:
              schema:
                type: object
                properties:
                  quoted_message:
                    type: object
                    nullable: true
    post:
      operationId: setQuotedMessage
      tags: [messages]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quoted_message:
                  type: object
                  nullable: true
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
components:
  schemas:
    Message:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        text:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        sent_by:
          type: string
          nullable: true
        parent_id:
          oneOf:
            - type: integer
            - type: string
          nullable: true
        show_in_channel:
          type: boolean
        custom_data:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
      required: [id]
    ThreadPreview:
      type: object
      properties:
        thread_id:
          type: string
        cid:
          type: string
        root_message:
          $ref: '#/components/schemas/Message'
        reply_count:
          type: integer
        last_reply_at:
          type: string
          format: date-time
          nullable: true
        last_reply_preview:
          $ref: '#/components/schemas/Message'
          nullable: true
      required: [thread_id, cid, root_message, reply_count]
    MuteStatus:
      type: object
      properties:
        muted:
          type: boolean
        muted_until:
          type: string
          format: date-time
          nullable: true
      required: [muted]
    MuteCreate:
      type: object
      properties:
        user_id:
          type: integer
        muted_until:
          type: string
          format: date-time
      required: [user_id]
    Mute:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
        muted_until:
          type: string
          format: date-time
          nullable: true
        muted_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    UserAgentInfo:
      type: object
      properties:
        user_agent:
          type: string
      required: [user_agent]
    WebPushKeys:
      type: object
      properties:
        p256dh:
          type: string
        auth:
          type: string
      required: [p256dh, auth]
    WebPushSubscription:
      type: object
      properties:
        endpoint:
          type: string
        expirationTime:
          type: number
          nullable: true
        keys:
          $ref: '#/components/schemas/WebPushKeys'
      required: [endpoint, keys]
    RegisterSubscriptionsRequest:
      type: object
      properties:
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/WebPushSubscription'
        client_id:
          type: string
        platform:
          type: string
          enum: [web, ios, android]
      required: [subscriptions]
    RegisterSubscriptionsResponse:
      type: object
      properties:
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/WebPushSubscription'
        client_id:
          type: string
          nullable: true
        platform:
          type: string
          nullable: true
    ReminderCreate:
      type: object
      properties:
        remind_at:
          type: string
          format: date-time
        message_id:
          type: integer
        note:
          type: string
      required: [remind_at]
    Reminder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        remind_at:
          type: string
          format: date-time
        message_id:
          type: integer
          nullable: true
        note:
          type: string
          nullable: true
        created_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    PollOption:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
