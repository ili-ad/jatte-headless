openapi: 3.0.2
info:
  title: ''
  version: ''
paths:
  /api/client-id/:
    get:
      operationId: listClientIDs
      description: Return a random client identifier.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    text:
                      type: string
                    body:
                      type: string
                    updated_at:
                      type: string
                      format: date-time
                  additionalProperties: true
          description: ''
      tags:
      - api
  /api/users/:
    get:
      operationId: listUsers
      description: ''
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
          description: ''
      tags:
      - api
  /api/user-agent/:
    get:
      operationId: listUserAgents
      description: Return the User-Agent string sent by the client.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAgentInfo'
      tags:
      - api
    post:
      operationId: setUserAgent
      description: Set or report the client User-Agent for the current user/session.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAgentInfo'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAgentInfo'
      tags:
      - api
  /api/user/:
    get:
      operationId: listCurrentUsers
      description: Return details for the current authenticated user.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: {}
          description: ''
      tags:
      - api
  /api/refresh-token/:
    get:
      operationId: listRefreshTokens
      description: ''
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: {}
          description: ''
      tags:
      - api
  /api/disconnected/:
    get:
      operationId: listDisconnecteds
      description: Return whether the current user is marked as disconnected.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: {}
          description: ''
      tags:
      - api
  /api/initialized/:
    get:
      operationId: listInitializeds
      description: Return whether the current user is marked as initialized.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: {}
          description: ''
      tags:
      - api
  /:
    get:
      operationId: listindices
      description: ''
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: {}
          description: ''
      tags:
      - ''
  /about/:
    get:
      operationId: listabouts
      description: ''
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: {}
          description: ''
      tags:
      - about
  /api/app-settings/:
    get:
      operationId: getAppSettings
      description: ''
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      tags:
      - api
  /api/tag/:
    get:
      operationId: listget_tags
      description: Return a constant tag value for tests.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: {}
          description: ''
      tags:
      - api
  /api/token/:
    get:
      operationId: listTokens
      description: Return the current user's ID and their Supabase access token.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: {}
          description: ''
      tags:
      - api
  /api/ws-auth/:
    get:
      operationId: listws_auths
      description: Return a signed websocket URL for authenticated requests.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: {}
          description: ''
      tags:
      - api
  /api/connection-id/:
    get:
      operationId: listconnection_ids
      description: ''
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: {}
          description: ''
      tags:
      - api
  /api/rooms/{room_uuid}/draft/:
    get:
      operationId: listRoomDrafts
      description: Save and retrieve message drafts.
      parameters:
      - name: room_uuid
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    text:
                      type: string
                    body:
                      type: string
                    updated_at:
                      type: string
                      format: date-time
                  additionalProperties: true
          description: ''
      tags:
      - api
    post:
      operationId: createRoomDraft
      description: Save and retrieve message drafts.
      parameters:
      - name: room_uuid
        in: path
        required: true
        description: ''
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema: {}
          application/x-www-form-urlencoded:
            schema: {}
          multipart/form-data:
            schema: {}
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: ''
      tags:
      - api
    delete:
      operationId: destroyRoomDraft
      description: Save and retrieve message drafts.
      parameters:
      - name: room_uuid
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '204':
          description: ''
      tags:
      - api
  /api/rooms/{cid}/messages/:
    get:
      operationId: listMessages
      description: List and create messages for a room.
      parameters:
      - name: cid
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
          description: ''
      tags:
      - api
    post:
      operationId: createMessage
      description: List and create messages for a room.
      parameters:
      - name: cid
        in: path
        required: true
        description: ''
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Message'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
      tags:
      - api
  /api/rooms/{cid}/mute/:
    get:
      operationId: muteStatus
      description: Return whether the current user has muted this room.
      parameters:
      - name: cid
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MuteStatus'
          description: ''
      tags:
      - api
  /api/rooms/{cid}/config/:
    get:
      operationId: listRoomConfigs
      description: Return basic metadata for the given room.
      parameters:
      - name: cid
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: {}
          description: ''
      tags:
      - api
  /api/rooms/{cid}/members/:
    get:
      operationId: listRoomMembersCIDs
      description: Return paginated members for the room identified by cid.
      parameters:
      - name: cid
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: {}
          description: ''
      tags:
      - api
  /api/rooms/{room_uuid}/config-state/:
    get:
      operationId: listRoomConfigStates
      description: Return message composer configuration for the room.
      parameters:
      - name: room_uuid
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: {}
          description: ''
      tags:
      - api
  /api/sync-user/:
    post:
      operationId: createSyncUser
      description: ''
      parameters: []
      requestBody:
        content:
          application/json:
            schema: {}
          application/x-www-form-urlencoded:
            schema: {}
          multipart/form-data:
            schema: {}
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: ''
      tags:
      - api
  /api/register-subscriptions/:
    post:
      operationId: registerSubscriptions
      description: Register web push subscriptions and echo them back.
      parameters: []
      requestBody:
        content:
          application/json:
            schema: {}
          application/x-www-form-urlencoded:
            schema: {}
          multipart/form-data:
            schema: {}
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: ''
      tags:
      - api
  /api/editing-audit-state/:
    post:
      operationId: createediting_audit_state
      description: Echo posted editing audit state after JWT auth.
      parameters: []
      requestBody:
        content:
          application/json:
            schema: {}
          application/x-www-form-urlencoded:
            schema: {}
          multipart/form-data:
            schema: {}
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: ''
      tags:
      - api
  /api/session/:
    delete:
      operationId: endSession
      description: ''
      parameters: []
      responses:
        '204':
          description: ''
      tags:
      - api
  /api/messages/{message_id}/:
    parameters:
      - name: message_id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getMessage
      description: Retrieve, update or delete a single message.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
      tags:
      - api
    put:
      operationId: updateMessage
      description: Retrieve, update or delete a single message.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
      tags:
      - api
    delete:
      operationId: deleteMessage
      description: Retrieve, update or delete a single message.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
      tags:
      - api
  /api/reminders/:
    get:
      operationId: listReminders
      description: List reminders for the current user.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: {}
          description: ''
      tags:
      - api
    post:
      operationId: createReminder
      description: Create a new reminder.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                remind_at:
                  type: string
                  format: date-time
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminder:
                    type: object
          description: ''
      tags:
      - api
  /api/mute-status/{target_username}/:
    parameters:
      - name: target_username
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: muteStatus
      description: Return whether the current user muted the given user.
      responses:
        '200':
          description: mute status
          content:
            application/json:
              schema:
                type: object
                properties:
                  muted:
                    type: boolean
      tags:
      - api
  /api/rooms/{cid}/mutes/:
    parameters:
      - name: cid
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: muteUser
      description: Mute a member in a room (moderation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MuteCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mute'
      tags:
      - api
  /api/unmute/{target_username}/:
    parameters:
      - name: target_username
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: unmuteUser
      description: Remove mute record for the given user.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
      tags:
      - api
components:
  schemas:
    MuteStatus:
      type: object
      properties:
        muted:
          type: boolean
        muted_until:
          type: string
          format: date-time
          nullable: true
      required:
        - muted
    MuteCreate:
      type: object
      properties:
        user_id:
          type: integer
        muted_until:
          type: string
          format: date-time
      required:
        - user_id
    Mute:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
        muted_until:
          type: string
          format: date-time
          nullable: true
        muted_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+\z
          maxLength: 150
      required:
      - username
    UserAgentInfo:
      type: object
      properties:
        user_agent:
          type: string
      required:
      - user_agent
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
        body:
          type: string
          readOnly: true
        sent_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Reminder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
        remind_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
