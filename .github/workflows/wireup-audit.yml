name: wireup-audit

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify-wireup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run wire-up audit tests
        run: pytest audit/tests
